
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Viewer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }


    nav {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      padding: 15px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: thin;
    }
    
    nav button {
      flex-shrink: 0;
    }


    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #e5e5e5;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    button:hover {
      background: #d0d0d0;
    }

    button.active {
      background: #333;
      color: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 71px);
      border: none;
      background: white;
    }
  </style>
</head>
<body>

  <nav id="buttons"></nav>

  <iframe id="viewer" title="Message viewer"></iframe>

  <script>
    const nav = document.getElementById("buttons");
    const viewer = document.getElementById("viewer");

    function showMessage(number) {
      viewer.src = `message_${number}.html`;

      document.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("active", i + 1 === number);
      });
    }

    for (let i = 1; i <= 8; i++) {
      const button = document.createElement("button");
      button.textContent = `Message ${i}`;
      button.onclick = () => showMessage(i);
      nav.appendChild(button);
    }

    showMessage(1);
  </script>

</body>
</html>
